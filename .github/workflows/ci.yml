name: Validar aplicação
on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: formaturas_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: formaturas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formaturas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://formaturas_test:test_only_password@localhost:5432/formaturas_test
      SETUP_KEY: somente-testes-automatizados-nao-usar-em-producao
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Validar regras e Excel
        run: npm test
      - name: Compilar aplicação
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Validar fluxo completo e PostgreSQL
        run: npm run test:e2e
      - name: Guardar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-formaturas
          path: |
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 7

  lockfile:
    name: Registrar dependências validadas
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/build/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verificacao-formaturas
          path: ${{ runner.temp }}/formaturas-ci-artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const branch = context.ref.slice('refs/heads/'.length);
            const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch});
            if (ref.data.object.sha !== context.sha) {
              core.info('A branch recebeu outra alteração; preservando a revisão atual.');
              return;
            }
            try {
              await github.rest.repos.getContent({owner, repo, path: 'package-lock.json', ref: branch});
              core.info('As dependências já estão registradas.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = fs.readFileSync(process.env.RUNNER_TEMP + '/formaturas-ci-artifacts/package-lock.json');
            const result = await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path: 'package-lock.json',
              message: 'build: registrar dependências aprovadas na validação',
              content: content.toString('base64')
            });
            core.info('Dependências registradas: ' + result.data.commit.sha);
